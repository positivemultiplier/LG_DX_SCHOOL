<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 폼</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        input[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        input[type="submit"]:active {
            transform: translateY(0);
        }
        .info {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>📝 회원가입</h2>
        
        <!-- 
            ⚠️ 중요: form action 경로
            - JSP를 직접 호출하면 안 됨! (/WEB-INF/는 외부 접근 불가)
            - 반드시 Servlet을 거쳐야 함
            - action="/EX10_request" → Servlet의 @WebServlet 경로
            - method="post" → 데이터를 숨겨서 전송 (보안)
        -->
        <form action="/EX10_request" method="post">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" 
                       id="name" 
                       name="name" 
                       placeholder="홍길동" 
                       required>
            </div>
            
            <div class="form-group">
                <label for="age">나이</label>
                <input type="text" 
                       id="age" 
                       name="age" 
                       placeholder="25" 
                       required
                       pattern="[0-9]+"
                       title="숫자만 입력하세요">
            </div>
            
            <input type="submit" value="회원가입">
        </form>
        
        <div class="info">
            💡 Servlet → JSP 연동 학습 예제
        </div>
    </div>
    
    <!-- 
        📚 학습 포인트:
        1. form action은 Servlet 경로로 설정 (/EX10_request)
        2. Servlet에서 데이터 처리 후 JSP로 forward
        3. JSP에서 결과 화면 출력
        
        데이터 흐름:
        HTML (입력) → Servlet (처리) → JSP (출력)
    -->
</body>
</html>
