<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        // 형변환 : 데이터의 타입을 변경하는 방법
        // 포인트 : 가장 많이 사용한느 형변환 -> 문자를 숫자로 변경 -> 웹에서 입력하는 창들은 데이터를 문자열로 받기 때문에
        // 형변환 parseInt(), parseFloat(), ★★★Number() 문자열->숫자, String() 숫자-> 문자열
        let num = "10";
        console.log(num);

        // 형변환 num2에 시켜보자 => 일반적인 경우 Number() 주로사용 
        let num2 = Number(num);
        console.log(num2);

        // 형변환 num3에 시켜보자 => pixel단위인경우 parseInt() => 문자사용
        let num3 = "10.5px";
        console.log(Number(num3)); // NaN 발생 => 결측치
        // console.log(parseInt(num3)); // 문자를 떼어버림, 정수만 나옴(버림).
        // console.log(parseFloat(num3)); // 문자를 떼어버림, 실수도 나옴.
        // 주의점 : 값에 시작이 문자면 parse 불가능 >> 숫자 + 문자면 parse 가능하다.

        console.log(num == num2); // 강제 형변환 시켜서 일반적으로 false로 안나오고, true로 나온다.
        // console.log(num === num2); // 형변환 시키지 말아라는 신호. => 안쓴다. JS는 대부분 문자로 받아들인다. 

    </script>
    
</body>
</html>
