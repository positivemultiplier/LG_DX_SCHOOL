<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수</title>
</head>
<body>
    <button onclick="plus(1,2,3,4,5)">알림창 실행</button>
    <button onclick="printText()">알림창 실행</button> 
    <!-- 동적 이벤트 제어 -->
    <script>
        // 1.함수(function) : 자주 쓰는 기능들을 묶어서 관리하는 방법
        // 동적 이벤트 제어를 해야한다. 3가지 연결 방법.
        
        
        // 1.1.button onclick="plus()" => 추천하지 않는다.=> ★★★코드를 숨겨야한다!!★★★ 사용자정의함수는 노출... => 내장함수는 노출되어도 상관없다. 
        // - JS로 함수를 제작 후에 반드시 html태그와 연결시켜야한다. 
        // - 주의점 : 태그 내부에 직접 함수명을 작성하는 기법은 권장하지 않는다. => 보안때문에.
        // - 사용처 : 간단한 함수, 내장함수 연결에는 괜찮다. 로컬 테스트용으로 활용한다.
        // ★★★★★JS함수 특징★★★★★ : 1. 오류 디버깅 유의하기 : 매개변수의 개수를 체크하지 않는다.
        // 매개변수값이 부족plus(1 )하면 undefined type, 넘치면plus(1,2,3,4,5) 삭제(3,4,5)한다.
        // 매개변수의 값이 문자, 숫자이면 + 연산을 제외한 나머지 연산은 정상적으로 동작한다. => 권장하지 않는다.
        // 1.1.1.매개변수의 개수를 구분하지 않는다. 1.1.2.type이 존재하지 않는다. => type을 구분하는것이 typescript를 많이 사용한다. 

        function plus(num1, num2) {
            // alert("더하기 입니다!");
            console.log(num1);
            console.log(num2);
        }

        
        // 1.2.ECMA6에 등장한 함수 문법이 권장사항 -> 애로우펑션(ArrowFunction)(()=>{})(화살표 함수) => 상수 const( constance )
        // (()=>{})
        // -react, vue 최신 라이브러리에서 반드시 사용한다.


        const printText = ()=>{
            alert("애로우펑션");
        }






        

    </script>
</body>
</html>
