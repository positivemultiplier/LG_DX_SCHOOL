<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>증가 감소 웹페이지</title>
</head>
<body>
    <p id="number">0</p>
    <button onclick="plus()">1 증가</button>
    <button onclick="minus()">1 감소</button>
    <script>
        // 실습목표 : 각각 버튼을 눌렀을 때, p태그의 값에 1 증가, 1 감소를 진행해야한다.
        // - 조건 : 숫자는 0 밑으로 내려가지 않는다. (음수 금지, 조건문)
        // - 필요기술 : 함수 2개 제작, 태그와 연결, textContent, 변경할 때는 대입한다. 
        // - 형변환 해야한다. (Number(),문자열 -> 숫자), 조건문.





        // const plus = ()=>{

        //     let number = Number(document.getElementById("number").textContent);
        //     number = number + 1;
        //     console.log(number);

   
            

        // }

        // const minus = ()=>{

        //     let number = Number(document.getElementById("number").textContent);
        //     number = number - 1;
        //     console.log(number);
        // }
        
        
        const plus = () => {

        // 1. p 태그 요소를 가져옵니다.
            const p_tag = document.getElementById("number");
            
            // 2. p 태그의 텍스트(문자)를 가져와 숫자(Number)로 변환합니다.
            let number = Number(p_tag.textContent);
            
            // 3. 숫자를 1 증가시킵니다.
            number = number + 1; // number++; 로 써도 됩니다.
            
            // 4. (★ 누락된 부분) 증가된 숫자를 다시 p 태그의 텍스트로 넣어줍니다.
            p_tag.textContent = number;

            console.log("증가 후:", number);
        }

        const minus = () => {
            // 1. p 태그 요소를 가져옵니다.
            const p_tag = document.getElementById("number");
            
            // 2. p 태그의 텍스트를 숫자로 변환합니다.
            let number = Number(p_tag.textContent);

            // 3. (★ 누락된 부분) 0보다 클 때만 감소하도록 조건을 겁니다.
            if (number > 0) {
                // 3-1. 숫자를 1 감소시킵니다.
                number = number - 1; // number--; 로 써도 됩니다.

                // 3-2. 감소된 숫자를 다시 p 태그에 넣어줍니다.
                p_tag.textContent = number;
                console.log("감소 후:", number);
            } else {
                // 0일 경우
                console.log("더 이상 감소할 수 없습니다. (현재: 0)");
            }
        }
    </script>



    </script>
</body>
</html>
