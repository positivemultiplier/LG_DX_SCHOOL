<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>덧셈 계산기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            background: #f0f0f0;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"] {
            width: 120px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        .operator {
            font-size: 24px;
            font-weight: bold;
            margin: 0 15px;
            color: #555;
        }
        input[type="submit"] {
            background: #FF7F50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 15px;
        }
        input[type="submit"]:hover {
            background: #FF6347;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>두 수를 입력 받아서 계산하기!</h1>
        <form action="Ex03_plus" method="GET">
            <div class="form-group">
                <input type="text" name="num1" placeholder="12" value="12" required>
                <span class="operator">+</span>
                <input type="text" name="num2" placeholder="12" value="12" required>
                <input type="submit" value="연산">
            </div>
        </form>
    </div>
</body>
</html>
