<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출력문</title>
</head>
<body>

    <!-- 자바스크립트를 html에서 사용하기 위해서는 반드시 script 태그를 넣어줘야 한다. -->

    
    <!--html 주석-->
    <script>
        // <!--JavaScript 주석-->
        // HTML파일에 JS를 활용하려면 반드시 <script>태그로 감싸야 한다. -> 다른 언어기 때문에
        
        /*
           # 1.출력문 3가지 document.write(), console.log(), alert()
        */

        // 1. alert() -> 사용자에게 메세지를 전달할 때 사용하는 출력문 
        // - 사용자의 상태가 변했을 때 알림을 활용 - ex) 구매완료, 회원탈퇴 등..
        alert("어서오세요! 반갑습니다!");

        // 2. console.log() -> 개발자가 결과를 확인할 때 사용한느 출력문 
        // - 주의점 : 반드시 결과를 확인 후 제거하자! -> 사용자에게 보여주지 않을 데이터
        console.log("DB에서 넘어온 데이터!");

        // 3. document.write() -> 화면에 직접 출력하는 출력문 
        // document는 뭐야 ? => this. 이다! => html 또는 현재 보고있는화면을 지칭한다. => 돔(Document Object Model)이다. 
        // - point : document -> 현재 화면의 html데이터를 담고 있는 최상위객체
        document.write("화면에 출력 하겠다!");



        

        

    </script>
</body>
</html>
