<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-3.7.1.min.js"></script>
</head>
<body>
    <button id="btn">영화 데이터 요청</button>
    <div id="content"></div>
    <script>
        // 실습 : 영화진흥위원회 OpenAPI를 비동기(Asyncronous)로 요청 -> 내 화면에 출력!!
        // 1. jQuery ajax를 활용
        // 2. fetch함수를 활용 -> 순수JS에 내장되어있는 비동기 기술(대중적으로 사용하는 기술)
        

        // API(Application Programming Interface) : 응용 프로그램에서 사용할 수 있도록 미리 만들어진 함수나 프로시저의 집합

        // 데이터API 사용법 : 
        // 1. 회원가입
        // 2. 인증키(Key) 발급
        // 3. 사용할 API 명세서 확인 (request 할 때 필수(key, days 등) 적어서 보내기.)
        // 4. 샘플코드 분석
        // 5. 샘플코드를 나만의 코드로 변환

        // 기술API 활용법
        // 1. 회원가입
        // 2.1. 인증키(Key) 발급
        // 2.2. ★ 플랫폼 등록 ( 웹/앱 )  사용URL 등록 => port 번호까지 적어야한다? 
        // 3. 사용할 API 명세서 확인
        // 4. 샘플코드 분석
        // 5. 샘플코드를 나만의 코드로 변환


        // # 영화진흥 위원회 오픈API 키
        // # https://kobis.or.kr/kobisopenapi/homepg/main/main.do

        // # // 발급키 :  174378de0d3cab928b73e5459fd9b18f
        // # // 관리명 : posmul
        // # // 사용제한 : 일 3000회

        // MOVIE_API_KEY=174378de0d3cab928b73e5459fd9b18f
        // http://kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=82ca741a2844c5c180a208137bb92bd7&targetDt=20120101
        
        // 개인 맞춤화 하기
        // key 에 내 발급키 넣기
        // targetDt 에 조회일자 넣기(yyyymmdd)
        // http://kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=174378de0d3cab928b73e5459fd9b18f&targetDt=20251027
        
        
        // MOVIE_API_NAME=posmul
        // MOVIE_API_DAILY_LIMIT=3000


    /*
    일별 박스오피스 API 서비스
    특정 일자 상영작들의 박스오피스 정보를 영화구분(다양성영화,상업영화), 한국/외국 구분, 상영지역 등의 조건을 통해 조회합니다.
    REST/SOAP 방식 중 선택적으로 호출가능하며 REST 방식의 응답형식은 XML과 JSON을 지원합니다.( URI의 extension으로 구분)

    1. REST 방식

    기본 요청 URL : http://www.kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.xml (또는 .json)
    요청 parameter : 3번항의 요청 인터페이스 정보를 참조하여 GET 방식으로 호출


    2. SOAP 방식

    요청 URL : http://www.kobis.or.kr/kobisopenapi/webservice/soap/boxoffice
    WSDL URL : http://www.kobis.or.kr/kobisopenapi/webservice/soap/boxoffice?wsdl
    Operation : searchDailyBoxOfficeList

    3. 인터페이스

    요청 인터페이스
    요청 변수	값	설명
    ★key★	문자열(★필수★)	발급받은키 값을 입력합니다.
    ★targetDt★	문자열(★필수★)	조회하고자 하는 날짜를 yyyymmdd 형식으로 입력합니다.
    itemPerPage	문자열	결과 ROW 의 개수를 지정합니다.(default : “10”, 최대 : “10“)
    multiMovieYn	문자열	다양성 영화/상업영화를 구분지어 조회할 수 있습니다.
    “Y” : 다양성 영화 “N” : 상업영화 (default : 전체)
    repNationCd	문자열	한국/외국 영화별로 조회할 수 있습니다.
    “K: : 한국영화 “F” : 외국영화 (default : 전체)
    wideAreaCd	문자열	상영지역별로 조회할 수 있으며, 지역코드는 공통코드 조회 서비스에서 “0105000000” 로서 조회된 지역코드입니다. (default : 전체)
    응답 구조
    응답 필드	값	설명
    boxofficeType	문자열	박스오피스 종류를 출력합니다.
    showRange	문자열	박스오피스 조회 일자를 출력합니다.
    rnum	문자열	순번을 출력합니다.
    rank	문자열	해당일자의 박스오피스 순위를 출력합니다.
    rankInten	문자열	전일대비 순위의 증감분을 출력합니다.
    rankOldAndNew	문자열	랭킹에 신규진입여부를 출력합니다.
    “OLD” : 기존 , “NEW” : 신규
    movieCd	문자열	영화의 대표코드를 출력합니다.
    movieNm	문자열	영화명(국문)을 출력합니다.
    openDt	문자열	영화의 개봉일을 출력합니다.
    salesAmt	문자열	해당일의 매출액을 출력합니다.
    salesShare	문자열	해당일자 상영작의 매출총액 대비 해당 영화의 매출비율을 출력합니다.
    salesInten	문자열	전일 대비 매출액 증감분을 출력합니다.
    salesChange	문자열	전일 대비 매출액 증감 비율을 출력합니다.
    salesAcc	문자열	누적매출액을 출력합니다.
    audiCnt	문자열	해당일의 관객수를 출력합니다.
    audiInten	문자열	전일 대비 관객수 증감분을 출력합니다.
    audiChange	문자열	전일 대비 관객수 증감 비율을 출력합니다.
    audiAcc	문자열	누적관객수를 출력합니다.
    scrnCnt	문자열	해당일자에 상영한 스크린수를 출력합니다.
    showCnt	문자열	해당일자에 상영된 횟수를 출력합니다.


    4. 응답 예시

    XML(extensiable markup language)
    http://kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.xml?key=82ca741a2844c5c180a208137bb92bd7&targetDt=20120101

    JSON(javascript object notation)
    http://kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json?key=82ca741a2844c5c180a208137bb92bd7&targetDt=20120101
            
    */





    // 실제 Data를 꺼내와서 rank, movieNm, audiAcc 출력해보기.
    // jQuery ajax활용
    // 1. jQuery를 통해서 비동기통신을 제작 -> 영화진흥위원회 API값을 요청
    
    // API 키를 변수로 관리 (학습용 - 실제 배포시에는 서버에서 관리)
    const MOVIE_API_KEY = '174378de0d3cab928b73e5459fd9b18f';
    
    const getData = () => {
        // 어제 날짜 계산 (API는 전날까지의 데이터만 제공)
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const targetDt = yesterday.toISOString().slice(0, 10).replace(/-/g, '');
        
        console.log('요청 날짜:', targetDt); // 디버깅용
        
        // 내가 제작해둔 url을 요청하는 로직 작성. 
        // 1.요청할url 2.요청방식(get/post 방식) 3.통신성공(success)시 실행함수 4.통신실패(error)시 실행함수 => 객체(object)로 묶어서
        $.ajax({
            // 1. (필수) 요청할 서버의 주소 
            url: "http://kobis.or.kr/kobisopenapi/webservice/rest/boxoffice/searchDailyBoxOfficeList.json",
            
            // 2. (선택) 통신방식 -> 요청방식 : get/post => default : get
            method: "GET",
            //쿼리문이 select DB에서 가지고 올때 사용한다. post 는 insert, update, delete 즉 table의 변화가 없을때 get, table에 변화가 있으면 post 방식이다. 보안때문에 get을 써야하지만  post를 어쩔 수 없이 쓰는것.
            
            // 파라미터를 data 속성으로 분리
            data: {
                key: MOVIE_API_KEY,
                targetDt: targetDt
            },

            // 3. (필수) 통신 성공했을 때 처리할 로직 => 반드시 return 받는 데이터를 저장할 매개변수(parameter)가 필요하다.
            // response는 매개변수로 ★받아오는★ res를 사용한다.  
            success : (res)=>{
                alert("통신 성공!");
                // 영화순위(rank), 제목(movieNm), 누적관객수(audiAcc) 출력 --> 객체는 key, 배열은 index로 조회한다. audience accumulated 이게 확실히 맞는지 볼때 명세표를 확인해야한다. 
                console.log(res.boxOfficeResult.dailyBoxOfficeList[0].rank); // 전체 응답 데이터 확인
                console.log(res.boxOfficeResult.dailyBoxOfficeList[0].movieNm);
                console.log(res.boxOfficeResult.dailyBoxOfficeList[0].audiAcc);
                
                // 1. for문을 활용하여  10개 데이터 화면에 출력
                for (let i = 0; i < res.boxOfficeResult.dailyBoxOfficeList.length; i++) {
                    console.log(res.boxOfficeResult.dailyBoxOfficeList[i].rank); // 전체 응답 데이터 확인
                    console.log(res.boxOfficeResult.dailyBoxOfficeList[i].movieNm);
                    console.log(res.boxOfficeResult.dailyBoxOfficeList[i].audiAcc);
                };

                // 2. for문을 활용한 출력과 동일한 기능을 하는 forEach문 활용
                res.boxOfficeResult.dailyBoxOfficeList.forEach(movie => {
                    console.log(`순위: ${movie.rank}, 제목: ${movie.movieNm}, 누적관객수: ${movie.audiAcc}`);
                });

                // 3. for문 활용해서 가독성을 높여주는 코드로 변경10개 데이터 모두 출력
                for (let i = 0; i < res.boxOfficeResult.dailyBoxOfficeList.length; i++) {
                    const movie = res.boxOfficeResult.dailyBoxOfficeList[i];
                    let div = document.getElementById("content");
 
                    console.log(`순위: ${movie.rank}, 제목: ${movie.movieNm}, 누적관객수: ${movie.audiAcc}`);
                    // 
                    div.innerHTML += `<p>${movie.rank}위 : ${movie.movieNm} / ${movie.audiAcc}명</p>`;
 
                };

                // 3. JSON데이터 분석법 
                // - JSON == 객체
                // - 데이터를 접근할 때 객체는 key, 배열은 index로 접근한다.
                // - 배열을 활용할 땐 반복문을 생각하자

                // 4. 내일 배울 내용 
                // - 바이브코딩 -> 프롬프트를 활용하여 사이트 제작
                // - 배포방법(deploy)

                
            },

            // 4.(권장) 통신 실패했을 때 처리할 로직
            error : ()=>{
                alert("통신 실패!");
            }

        });
    };
    
    // 이벤트 리스너는 함수 밖에서 등록
    $("#btn").on("click", getData);

        
    </script>
</body>
</html>
