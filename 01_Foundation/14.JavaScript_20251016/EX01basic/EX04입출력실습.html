<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입출력실습</title>
</head>
<body>

    <script>
        
        // 실습목표 : 사용자에게 이름을 입력받은 후, 그 값을 콘솔창에 출력
        // 필요기능 : 입력 -> prompt(); 변수저장 : let, 변수출력 : console.log()


        // 자료형 : un-defined vs null 
        // null => "없다"라는 의미를 가진 데이터 -> 메모리를 할당 有
        // let num = null;
        // un-defined => "비어있다"의 의미를 가짐 -> 메모리에 할당 無
        // let num2;
        // 포인트 : 값을 검증했을 때 un-defined 이 나오면 통신이 잘 되지 않았다 -> 값을 넘겨받지 못했다. 
        // ★★★ un-defined 오류 : 1) 서버가 값(Data)을 전달하지 못하는 경우 => 서버 or DB에서 직접확인을 해야한다. 
        // ★★★ un-defined 오류 : 2) 주고받는 데이터의 개수가 다를 때.



        
        let name = prompt("이름을 입력하세요.", "영문으로만 입력하세요");
        // prompt()함수 => return 함수!!  => 변수에 담아넣을 수 있다.



        // 방법1 연산활용 => 지양하자
        console.log( name + "님, 환영합니다! 연산(+)활용");
        // consol.log() => return 함수가 아니다!! 
        // 변수를 사용할때는 연산을 시키면 안된다. => 문자와 문자를 더하는 행위는 지양하자! 
        
        // 방법2.  python에서는 formating기법처럼 JavaScript에도 비슷한 방법이 있다. => 추천한다!
        console.log(`${name}님, 환영합니다! 백틱활용`); 

        // 자바에서는 '' 문자 "" 문자열 => 자바스크립트에서는 백틱(`${name}`) 사용한다.
        
        // 방법3. 매개변수 활용
        console.log(name,"님, 환영합니다! 매개변수활용")



    </script>
    
</body>
</html>
