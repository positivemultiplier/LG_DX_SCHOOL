<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>형변환 실습</title>
</head>
<body>
    <script>

        // 실습목표 : 사용자에게 두개의 수를 입력받아서, 더한 결과를 콘솔창에 출력
        // 필요기술 : prompt(), let, Number(), consol.log();
        // 핵심 : 반드시 코드를 완성하면, 코드를 재사용성, 유지보수성이 좋게 수정하는 연습하자.
        

        // 코드의 재사용성을 생각해서 코드를 짜보자!
        // let num1 =Number(prompt("첫번째 숫자를 입력하세요", "정수만 입력해라")) ;

        // let num2 =Number(prompt("첫번째 숫자를 입력하세요", "정수만 입력해라"));

        // console.log(num1+num2);

        

        // 재사용성이 좋게 변수 2개만써라. 
        let numbers = [];
        
        for (let index = 0; index < 2; index++) {
            numbers[index] = Number(prompt((index + 1) + "번째 숫자를 입력하세요", "정수만 입력해라"));
        }

        console.log(numbers[0] + numbers[1]);


    </script>
</body>
</html>
