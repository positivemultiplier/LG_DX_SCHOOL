<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response sendRedirect 실습</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .description {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }
        .description h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .description p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .redirect-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .site-button {
            padding: 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .site-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .naver {
            background: linear-gradient(135deg, #03C75A 0%, #00B248 100%);
        }
        .google {
            background: linear-gradient(135deg, #4285F4 0%, #357AE8 100%);
        }
        .youtube {
            background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
        }
        .icon {
            font-size: 24px;
        }
        .info {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: #888;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #e83e8c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Response sendRedirect()</h1>
        <p class="subtitle">원하는 페이지를 선택하면 해당 페이지로 이동합니다</p>
        
        <div class="description">
            <h3>📚 학습 내용</h3>
            <p><strong>sendRedirect()</strong> - 브라우저에게 새로운 페이지로 이동하라고 지시</p>
            <p>• 버튼 클릭 → Servlet 실행 → sendRedirect() → 외부 사이트 이동</p>
            <p>• URL이 완전히 바뀜 (새로운 요청 생성)</p>
        </div>

        <div class="button-group">
            <!-- 
                각 폼은 서버의 /EX11_response Servlet으로 데이터를 POST 방식으로 전송
                site 파라미터로 어느 사이트로 갈지 구분
            -->
            <form action="/EX11_response" method="post" class="redirect-form">
                <input type="hidden" name="site" value="naver">
                <button type="submit" class="site-button naver">
                    <span class="icon">🟢</span>
                    <span>네이버로 이동</span>
                </button>
            </form>

            <form action="/EX11_response" method="post" class="redirect-form">
                <input type="hidden" name="site" value="google">
                <button type="submit" class="site-button google">
                    <span class="icon">🔵</span>
                    <span>구글로 이동</span>
                </button>
            </form>

            <form action="/EX11_response" method="post" class="redirect-form">
                <input type="hidden" name="site" value="youtube">
                <button type="submit" class="site-button youtube">
                    <span class="icon">🔴</span>
                    <span>유튜브로 이동</span>
                </button>
            </form>
        </div>

        <div class="info">
            💡 <code>sendRedirect()</code>는 브라우저에게 새 URL로 가라고 지시합니다.<br>
            서버에서 직접 이동하는 <code>forward()</code>와는 다릅니다!
        </div>
    </div>
</body>
</html>
