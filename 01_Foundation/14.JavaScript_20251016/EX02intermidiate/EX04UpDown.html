<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="number">0</p>
    <button onclick="plus()">1 증가</button>
    <button onclick="minus()">1 감소</button>
    <script>
        // 실습목표 : 각각 버튼을 눌렀을 때, p태그의 값에 1 증가, 1 감소를 진행해야한다.
        // - 조건 : 숫자는 0 밑으로 내려가지 않는다. (음수 금지, 조건문)
        // - 필요기술 : 함수 2개 제작, 태그와 연결, textContent, 변경할 때는 대입한다. 형변환 해야한다. (Number(),문자열 -> 숫자), 조건문.
        // - ★★★포인트★★★ : JS에서는 변수에 저장할 때 값이 아닌 "요소"를 저장하는게 관리가 편하다. 

        // JS에서는 요소까지는 변수에 넣으면된다. But 값까지 변수에 넣으면 안된다.
        // 값을 넣으면 "0" = num("0") + 1; 이되버린다. 성립이 안되는것. 
        // p_tag.textContent = number(p_tag.textContent) + 1;
        // 요소에 집중해야한다. 
        
        // 변수에 값을 넣고싶다면 number
        // 반드시 증감연산자를 사용해야한다. 
    

    const plus = ()=>{
        let p_tag = document.getElementById("number");
        let number = Number(p_tag.textContent);
        number = number + 1; // ++ 증감연산자는 변수와 써야한다. 값에는 증감연산자가 먹히지 않는다. 
        p_tag.textContent = number; // number ++; 
        console.log("증가후의 값 : " + number);

    }

    const minus = ()=>{
        let p_tag = document.getElementById("number");
        let number = Number(p_tag.textContent);
        if (number > 0) { /// condition에서 숫자와 숫자를 비교해줘야한다. 
            number = number - 1;
            p_tag.textContent = number;
            console.log("감소후의 값 : " + number);
        }else{
            p_tag.textContent = 0;
            console.log("더이상 감소 시킬 수 없습니다.")

        }

    }
    
    
    </script>
    
</body>
</html>
